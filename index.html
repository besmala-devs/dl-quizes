<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study quizzes</title>
<style>
:root{--bg:#fbf8f6;--card:#fff;--ink:#4a4458;--muted:#8d869a;--line:#eee7ee;--mint:#d3eee2;--lav:#dcd6f5;--sky:#d4e8f7;--peach:#fbe3d0;--pink:#f6d6e0;--ok:#bfe8d4;--bad:#f7cdd3}
@media(prefers-color-scheme:dark){:root{--bg:#1f1d27;--card:#2a2734;--ink:#ece8f5;--muted:#a49db3;--line:#3a3646;--mint:#35534a;--lav:#443f66;--sky:#34495c;--peach:#5c4636;--pink:#5c3b49;--ok:#2f5a49;--bad:#613843}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 ui-rounded,"Nunito","Segoe UI",system-ui,sans-serif}
#app{max-width:680px;margin:0 auto;padding:40px 20px 80px}
h1{font-size:2rem;margin:0 0 4px;font-weight:700}
h2{font-size:1.25rem;line-height:1.4;margin:14px 0 18px;font-weight:600}
h3{font-size:1rem;margin:28px 0 10px;color:var(--muted);font-weight:600}
.sub{color:var(--muted);margin:0 0 28px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
button,.btn{font:inherit;color:inherit;cursor:pointer}
.card{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:18px}
.card:hover,.opt:hover:not(:disabled){border-color:var(--lav)}
.card small{color:var(--muted)}
.em{font-size:1.8rem}
.row{display:flex;align-items:center;gap:12px}.row .card{flex:1;flex-direction:row;align-items:center;justify-content:space-between}
.chip{border-radius:999px;padding:3px 12px;font-size:.8rem;background:var(--lav);color:var(--ink)}
.mint{background:var(--mint)}.lav{background:var(--lav)}.sky{background:var(--sky)}.peach{background:var(--peach)}.pink{background:var(--pink)}
.btn{display:inline-block;border:0;border-radius:999px;padding:10px 22px;background:var(--lav);margin-top:16px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);padding:6px 16px;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);margin-bottom:12px}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--lav);transition:width .3s}
.qbox{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;margin-top:20px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:transparent;border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;color:var(--ink)}
.opt.sel{border-color:var(--lav);background:var(--lav)}
.opt.ok{background:var(--ok);border-color:var(--ok)}.opt.bad{background:var(--bad);border-color:var(--bad)}
textarea{width:100%;min-height:110px;border:1.5px solid var(--line);border-radius:14px;padding:12px;font:inherit;background:transparent;color:var(--ink);resize:vertical}
.fb{margin-top:18px;padding:14px 16px;border-radius:14px;background:var(--bg)}
.rate{display:flex;gap:8px;flex-wrap:wrap}.rate .btn{margin-top:10px}
.big{font-size:3rem;font-weight:700;margin:10px 0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<main id="app"></main>
<script>
const TYPES={tf:["True / False","mint"],single:["Multiple choice","lav"],multi:["Several answers","sky"],open:["Open-ended","peach"],mixed:["Midterm style","pink"]};
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let imported=get('qz-imported',[]),best=get('qz-best',{}),S={},folder=[],loading=true,status={manifest:'not checked',api:'not checked',files:[]};
const validChapter=c=>c&&c.chapter&&c.chapter.id&&Array.isArray(c.quizzes);
// folder chapters first, manually imported ones override on same id
const chapters=()=>{const m=new Map();[...folder,...imported].forEach(c=>m.set(c.chapter.id,c));return[...m.values()]};
const chap=()=>chapters().find(c=>c.chapter.id===S.ch);

/* ---------- Auto-load every quiz JSON that sits next to index.html ---------- */
async function listFiles(){
  const names=new Set();
  // 1) manifest.json (list of file names, generated by the GitHub Action)
  try{
    const r=await fetch('manifest.json',{cache:'no-store'});
    if(r.ok){const l=await r.json();if(Array.isArray(l)){l.forEach(n=>names.add(n));status.manifest=l.length+' file(s)'}}
    else status.manifest='HTTP '+r.status;
  }catch(e){status.manifest='error: '+e.message}
  // 2) ALSO ask the GitHub API, so a new file shows up even if the manifest is stale
  //    (works on https://USER.github.io/REPO/ for public repos)
  try{
    const h=location.hostname,parts=location.pathname.split('/').filter(Boolean);
    if(h.endsWith('.github.io')){
      const user=h.split('.')[0];
      const repo=parts.length&&!parts[0].includes('.')?parts[0]:h;
      const sub=(repo===h?parts:parts.slice(1)).filter(p=>!p.includes('.')).join('/');
      const r=await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${sub}`);
      if(r.ok){const l=await r.json();const j=l.filter(f=>f.type==='file'&&/\.json$/i.test(f.name));j.forEach(f=>names.add(f.name));status.api=j.length+' file(s)'}
      else status.api='HTTP '+r.status+(r.status===403?' (rate limit)':'');
    }else status.api='skipped (not on github.io)';
  }catch(e){status.api='error: '+e.message}
  return [...names];
}
async function loadFolder(){
  const names=(await listFiles()).filter(n=>/\.json$/i.test(n)&&n.toLowerCase()!=='manifest.json').sort();
  const lists=await Promise.all(names.map(async n=>{
    try{
      const r=await fetch(encodeURIComponent(n),{cache:'no-store'});
      if(!r.ok){status.files.push(n+': HTTP '+r.status);return[]}
      const ok=[].concat(await r.json()).filter(validChapter);
      status.files.push(n+(ok.length?': OK':': invalid quiz format'));return ok;
    }catch(e){status.files.push(n+': '+e.message);return[]}
  }));
  folder=lists.flat();
}

function home(){
  S={};
  const list=chapters();
  app.innerHTML=`<h1>Study quizzes</h1><p class="sub">Choose a chapter.</p>`+
  (list.length?`<div class="grid">${list.map(c=>`<button class="card" data-ch="${esc(c.chapter.id)}"><span class="em">${esc(c.chapter.emoji||'📘')}</span><b>${esc(c.chapter.title)}</b><small>${esc(c.chapter.description)}</small><small>${c.quizzes.length} quizzes</small></button>`).join('')}</div>`
   :`<p class="sub">${loading?'Loading chapters…':'No chapters found. Put quiz .json files next to index.html, or import one below.'}</p>`)+
  `<label class="btn ghost" style="margin-top:28px">Import chapter JSON<input type="file" id="imp" accept=".json" multiple hidden></label>`+
  (loading?'':`<details style="margin-top:24px;color:var(--muted);font-size:.85rem"><summary>Loading details</summary><p>manifest.json: ${esc(status.manifest)}<br>GitHub API: ${esc(status.api)}<br>${status.files.map(esc).join('<br>')||'No files tried'}</p></details>`);
}
function openChapter(id){
  S={ch:id};const c=chap();
  const groups=Object.keys(TYPES).map(t=>[t,c.quizzes.map((q,i)=>[q,i]).filter(([q])=>q.type===t)]).filter(g=>g[1].length);
  app.innerHTML=`<button class="btn ghost" data-act="home">← Chapters</button><h1 style="margin-top:20px">${esc(c.chapter.emoji||'')} ${esc(c.chapter.title)}</h1><p class="sub">${esc(c.chapter.description)}</p>`+
  groups.map(([t,list])=>`<h3>${TYPES[t][0]}</h3>${list.map(([q,i])=>{const b=best[c.chapter.id+'/'+q.id];return`<div class="row" style="margin-bottom:10px"><button class="card" data-quiz="${i}"><span><b>${esc(q.title)}</b><br><small>${q.questions.length} questions</small></span><span class="chip ${TYPES[t][1]}">${b==null?'start':b+'%'}</span></button></div>`}).join('')}`).join('');
}
function startQuiz(i){S={ch:S.ch,qi:i,quiz:chap().quizzes[i],i:0,score:0};renderQ()}
const correct=(q,t)=>t==='tf'?[q.answer?0:1]:t==='single'?[q.answer]:q.answer;
function renderQ(){
  const z=S.quiz,q=z.questions[S.i],t=q.type||z.type,n=z.questions.length;
  S.t=t;S.done=false;S.sel=[];
  const opts=t==='tf'?['True','False']:(q.options||[]);
  app.innerHTML=`<div class="top"><button class="btn ghost" data-act="chapter">← Quit</button><span>${S.i+1} / ${n}</span></div><div class="bar"><i style="width:${S.i/n*100}%"></i></div>
  <div class="qbox"><span class="chip ${TYPES[t][1]}">${TYPES[t][0]}</span><h2>${esc(q.q)}</h2>`+
  (t==='open'?`<textarea placeholder="Write your answer…"></textarea><button class="btn" data-act="reveal">Show model answer</button>`:
  `<div class="opts">${opts.map((o,k)=>`<button class="opt" data-opt="${k}">${esc(o)}</button>`).join('')}</div>${t==='multi'?'<button class="btn" data-act="check">Check answer</button>':''}`)+`<div id="fb"></div></div>`;
}
function nextBtn(){return`<button class="btn" data-act="next">${S.i+1<S.quiz.questions.length?'Next question':'See result'}</button>`}
function pick(k){
  if(S.done)return;
  if(S.t==='multi'){S.sel=S.sel.includes(k)?S.sel.filter(x=>x!==k):[...S.sel,k];document.querySelectorAll('.opt').forEach(b=>b.classList.toggle('sel',S.sel.includes(+b.dataset.opt)))}
  else{S.sel=[k];check()}
}
function check(){
  if(S.done||!S.sel.length)return;S.done=true;
  const q=S.quiz.questions[S.i],cor=correct(q,S.t),ok=cor.length===S.sel.length&&cor.every(k=>S.sel.includes(k));
  document.querySelectorAll('.opt').forEach(b=>{const k=+b.dataset.opt;b.disabled=true;b.classList.remove('sel');if(cor.includes(k))b.classList.add('ok');else if(S.sel.includes(k))b.classList.add('bad')});
  if(ok)S.score++;
  document.getElementById('fb').innerHTML=`<div class="fb"><b>${ok?'Correct':'Not quite'}.</b> ${esc(q.explain)}</div>${nextBtn()}`;
}
function reveal(){
  if(S.done)return;S.done=true;const q=S.quiz.questions[S.i];
  document.getElementById('fb').innerHTML=`<div class="fb"><b>Model answer</b><br>${esc(q.answer)}${q.explain?`<br><br><small>${esc(q.explain)}</small>`:''}</div><p class="sub" style="margin:16px 0 0">How did you do?</p><div class="rate"><button class="btn mint" data-act="rate" data-v="1">Got it</button><button class="btn peach" data-act="rate" data-v="0.5">Partly</button><button class="btn pink" data-act="rate" data-v="0">Missed</button></div>`;
}
function next(){S.i++;S.i<S.quiz.questions.length?renderQ():finish()}
function finish(){
  const n=S.quiz.questions.length,pct=Math.round(S.score/n*100),key=S.ch+'/'+S.quiz.id;
  best[key]=Math.max(best[key]||0,pct);put('qz-best',best);
  app.innerHTML=`<div class="qbox" style="text-align:center"><span class="chip ${TYPES[S.quiz.type][1]}">${esc(S.quiz.title)}</span><div class="big">${pct}%</div><p class="sub">${S.score} of ${n} correct. ${pct>=80?'Great work.':pct>=50?'Good progress, review the misses.':'Keep going, try again.'}</p><button class="btn" data-act="retry">Try again</button> <button class="btn ghost" data-act="chapter">Back to chapter</button></div>`;
}
function act(a,d){
  if(a==='home')home();else if(a==='chapter')openChapter(S.ch);else if(a==='next')next();else if(a==='check')check();
  else if(a==='reveal')reveal();else if(a==='retry')startQuiz(S.qi);else if(a==='rate'){S.score+=+d.v;next()}
}
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act],[data-opt],[data-ch],[data-quiz]');if(!b)return;const d=b.dataset;
  if(d.ch)openChapter(d.ch);else if(d.quiz!==undefined)startQuiz(+d.quiz);else if(d.opt!==undefined)pick(+d.opt);else act(d.act,d);
});
app.addEventListener('change',e=>{
  if(e.target.id!=='imp')return;
  [...e.target.files].forEach(f=>{const r=new FileReader();r.onload=()=>{
    try{const j=JSON.parse(r.result);[].concat(j).forEach(c=>{if(!validChapter(c))throw 0;imported=imported.filter(x=>x.chapter.id!==c.chapter.id);imported.push(c)});put('qz-imported',imported);home()}
    catch(err){alert('Could not read '+f.name+'. Check that it follows the quiz JSON format.')}};r.readAsText(f)});
});
home();
loadFolder().finally(()=>{loading=false;if(!S.ch)home()});
</script>
</body>
</html>
